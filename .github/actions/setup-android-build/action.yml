name: Set up Android build
description: >
  Installs Node/JDK, builds the web assets for the Android target, and syncs Capacitor's native
  project. Shared by android.yml (PR debug-build smoke test) and android-release.yml (signed
  release build published to GitHub Releases) so the two can't silently drift out of sync —
  before this existed, both workflows carried a byte-for-byte copy of these same steps.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    # ubuntu-latest ships a preinstalled Android SDK, so no separate SDK setup step is needed —
    # only the JDK the Gradle build itself runs on.
    - name: Build web assets for the Android target (base '/', not GitHub Pages' '/arthquest-pwa/')
      run: npm run build:android
      shell: bash

    - name: Sync Capacitor's native Android project with the built web assets
      run: npx cap sync android
      shell: bash
