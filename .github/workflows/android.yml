name: Android debug APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # playwright is a devDependency used only for local visual QA scripts
      # (scripts/screenshot*.mjs) — CI never launches a browser, so skip the
      # otherwise-automatic Chromium download on install.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships a preinstalled Android SDK, so no separate SDK setup step is needed —
      # only the JDK the Gradle build itself runs on.
      - name: Build web assets for the Android target (base '/', not GitHub Pages' '/arthquest-pwa/')
        run: npm run build:android

      - name: Sync Capacitor's native Android project with the built web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arthquest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
