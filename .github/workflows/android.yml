name: Android debug APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # playwright is a devDependency used only for local visual QA scripts
      # (scripts/screenshot*.mjs) — CI never launches a browser, so skip the
      # otherwise-automatic Chromium download on install.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arthquest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
